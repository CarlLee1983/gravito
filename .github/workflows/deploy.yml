name: Deploy Gravito Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'examples/official-site/**'
      - 'packages/**'
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

      - name: Build All Packages
        run: bun run build

      - name: Build Official Site
        working-directory: examples/official-site
        run: |
          set -euo pipefail  # Exit on any error, undefined vars, pipe failures
          
          echo "📦 Current directory: $(pwd)"
          echo "📦 Environment variables:"
          echo "  NODE_ENV: ${NODE_ENV:-not set}"
          echo "  VITE_GA_ID: ${VITE_GA_ID:+set (hidden)}${VITE_GA_ID:-not set}"
          
          # Verify dependencies are built
          echo "📦 Verifying package dependencies..."
          if [ ! -d "../../packages/core/dist" ]; then
            echo "❌ @gravito/core not built!"
            exit 1
          fi
          echo "✅ Dependencies verified"
          
          # Build client assets
          echo "📦 Building client assets..."
          if ! bun run build:client; then
            echo "❌ Client build failed!"
            echo "📦 Checking for build errors..."
            if [ -d "static/build" ]; then
              echo "⚠️  static/build directory exists but build may have failed"
              ls -la static/build/ || true
            fi
            exit 1
          fi
          echo "✅ Client build completed"
          
          # Verify client build output
          if [ ! -d "static/build" ]; then
            echo "❌ Client build output (static/build) not found!"
            echo "📦 Available directories:"
            ls -la
            exit 1
          fi
          echo "✅ Client build output verified"
          
          # Build static site
          echo "📦 Building static site..."
          if ! bun run build:static; then
            echo "❌ Static site build failed!"
            echo "📦 Checking for partial build output..."
            if [ -d "dist-static" ]; then
              echo "⚠️  dist-static directory exists but build may have failed"
              ls -la dist-static/ | head -20 || true
            fi
            exit 1
          fi
          echo "✅ Build completed"
          
          # Verify build output
          echo "📦 Checking dist-static directory..."
          if [ ! -d "dist-static" ]; then
            echo "❌ dist-static directory NOT found!"
            echo "📦 Available directories:"
            ls -la
            exit 1
          fi
          
          echo "✅ dist-static directory exists"
          echo "📦 Contents:"
          ls -la dist-static/ | head -30
          
          if [ ! -f "dist-static/index.html" ]; then
            echo "❌ index.html NOT found!"
            echo "📦 Searching for HTML files:"
            find dist-static -name "*.html" | head -10 || true
            exit 1
          fi
          echo "✅ index.html exists"
          ls -lh dist-static/index.html
        env:
          NODE_ENV: production
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}

      - name: Verify Build Output
        working-directory: examples/official-site
        run: |
          echo "🔍 Verifying build output..."
          echo "Current directory: $(pwd)"
          echo "Contents of examples/official-site:"
          ls -la | head -20
          
          if [ ! -d "dist-static" ]; then
            echo "❌ dist-static directory not found!"
            echo "Available directories:"
            ls -la
            exit 1
          fi
          
          echo "Contents of dist-static:"
          ls -la dist-static/ | head -30
          
          if [ ! -f "dist-static/index.html" ]; then
            echo "❌ dist-static/index.html not found!"
            echo "Files in dist-static:"
            find dist-static -type f -name "*.html" | head -20
            exit 1
          fi
          
          if [ ! -f "dist-static/404.html" ]; then
            echo "❌ dist-static/404.html not found!"
            echo "Files in dist-static:"
            find dist-static -type f -name "*.html" | head -20
            exit 1
          fi
          
          echo "✅ Build output verified successfully"
          echo "Key files:"
          ls -lh dist-static/index.html dist-static/404.html dist-static/CNAME dist-static/.nojekyll 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/official-site/dist-static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
