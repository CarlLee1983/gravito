name: Deploy Gravito Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'examples/official-site/**'
      - 'packages/**'
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

      - name: Build All Packages
        run: bun run build

      - name: Build Official Site
        working-directory: examples/official-site
        timeout-minutes: 10
        run: |
          set -euo pipefail  # Exit on any error, undefined vars, pipe failures
          
          echo "📦 ========================================"
          echo "📦 Building Official Site"
          echo "📦 ========================================"
          echo "📦 Current directory: $(pwd)"
          echo "📦 Working directory: examples/official-site"
          echo "📦 Environment variables:"
          echo "  NODE_ENV: ${NODE_ENV:-not set}"
          echo "  VITE_GA_ID: ${VITE_GA_ID:+set (hidden)}${VITE_GA_ID:-not set}"
          echo ""
          
          # Verify we're in the right directory
          if [ ! -f "package.json" ]; then
            echo "❌ package.json not found! Wrong directory?"
            echo "📦 Current directory: $(pwd)"
            ls -la
            exit 1
          fi
          echo "✅ package.json found"
          
          # Verify dependencies are built
          echo "📦 Verifying package dependencies..."
          if [ ! -d "../../packages/core/dist" ]; then
            echo "❌ @gravito/core not built!"
            echo "📦 Checking packages directory..."
            ls -la ../../packages/ | head -10 || true
            echo "💡 Make sure 'Build All Packages' step completed successfully"
            exit 1
          fi
          echo "✅ @gravito/core built"
          
          # Check for other critical dependencies
          for pkg in photon ion prism stasis constellation; do
            if [ -d "../../packages/$pkg/dist" ]; then
              echo "✅ @gravito/$pkg built"
            else
              echo "⚠️  @gravito/$pkg not found (may be optional)"
            fi
          done
          echo ""
          
          # Build static site (this will also build client assets internally)
          echo "📦 ========================================"
          echo "📦 Starting build process..."
          echo "📦 This may take a few minutes..."
          echo "📦 ========================================"
          
          # Create log file
          BUILD_LOG="/tmp/build-output-$(date +%s).log"
          echo "📦 Build log: $BUILD_LOG"
          
          # Run build and capture output
          set +e  # Temporarily disable exit on error to capture full output
          bun run build:static 2>&1 | tee "$BUILD_LOG"
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          set -e  # Re-enable exit on error
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ ========================================"
            echo "❌ Static site build failed!"
            echo "❌ Exit code: $BUILD_EXIT_CODE"
            echo "❌ ========================================"
            echo ""
            echo "📦 Last 100 lines of build output:"
            tail -100 "$BUILD_LOG" || true
            echo ""
            echo "📦 Checking for partial build output..."
            
            # Check client build output
            if [ -d "static/build" ]; then
              echo "⚠️  static/build directory exists:"
              ls -la static/build/ | head -10 || true
            else
              echo "⚠️  static/build directory not found"
            fi
            
            # Check static site output
            if [ -d "dist-static" ]; then
              echo "⚠️  dist-static directory exists:"
              ls -la dist-static/ | head -20 || true
              echo "📦 Files in dist-static:"
              find dist-static -type f | head -30 || true
            else
              echo "⚠️  dist-static directory not found"
            fi
            
            echo ""
            echo "📦 Current directory contents:"
            ls -la | head -20 || true
            
            echo ""
            echo "📦 Checking for error patterns in log..."
            grep -i "error\|fail\|exception" "$BUILD_LOG" | tail -20 || true
            
            exit 1
          fi
          
          echo ""
          echo "✅ ========================================"
          echo "✅ Build completed successfully"
          echo "✅ ========================================"
          echo ""
          
          # Verify build output
          echo "📦 Verifying build output..."
          if [ ! -d "dist-static" ]; then
            echo "❌ dist-static directory NOT found!"
            echo "📦 Available directories:"
            ls -la
            exit 1
          fi
          
          echo "✅ dist-static directory exists"
          echo "📦 Contents (first 30 items):"
          ls -la dist-static/ | head -30
          
          if [ ! -f "dist-static/index.html" ]; then
            echo "❌ index.html NOT found!"
            echo "📦 Searching for HTML files:"
            find dist-static -name "*.html" -type f | head -10 || true
            echo "📦 All files in dist-static:"
            find dist-static -type f | head -20 || true
            exit 1
          fi
          echo "✅ index.html exists"
          ls -lh dist-static/index.html
          
          # Check for other critical files
          for file in 404.html CNAME .nojekyll; do
            if [ -f "dist-static/$file" ]; then
              echo "✅ $file exists"
            else
              echo "⚠️  $file not found (may be optional)"
            fi
          done
          
          echo ""
          echo "✅ Build verification completed successfully"
        env:
          NODE_ENV: production
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}

      - name: Verify Build Output
        working-directory: examples/official-site
        run: |
          echo "🔍 Verifying build output..."
          echo "Current directory: $(pwd)"
          echo "Contents of examples/official-site:"
          ls -la | head -20
          
          if [ ! -d "dist-static" ]; then
            echo "❌ dist-static directory not found!"
            echo "Available directories:"
            ls -la
            exit 1
          fi
          
          echo "Contents of dist-static:"
          ls -la dist-static/ | head -30
          
          if [ ! -f "dist-static/index.html" ]; then
            echo "❌ dist-static/index.html not found!"
            echo "Files in dist-static:"
            find dist-static -type f -name "*.html" | head -20
            exit 1
          fi
          
          if [ ! -f "dist-static/404.html" ]; then
            echo "❌ dist-static/404.html not found!"
            echo "Files in dist-static:"
            find dist-static -type f -name "*.html" | head -20
            exit 1
          fi
          
          echo "✅ Build output verified successfully"
          echo "Key files:"
          ls -lh dist-static/index.html dist-static/404.html dist-static/CNAME dist-static/.nojekyll 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/official-site/dist-static

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
