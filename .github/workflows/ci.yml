name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Lint Job (Parallel, fast)
  # --------------------------------------------------------------------------
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
      - name: Run linting
        run: bun run check

  # --------------------------------------------------------------------------
  # Main Pipeline (Combined to avoid artifact overhead while maintaining speed)
  # --------------------------------------------------------------------------
  pipeline:
    name: Build, Typecheck & Test
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
            **/tsconfig.tsbuildinfo
          key: turbo-full-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-full-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}-
            turbo-full-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

      - name: Run Build
        run: bun run build

      # Run these in parallel on the same machine using Turbo
      - name: Run Typecheck & Tests
        run: |
          # Use turbo to run both typecheck and tests in parallel on the runner
          # Filter to only packages and satellites (exclude examples to avoid CI failures)
          # This is faster than separate steps because it utilizes multiple cores
          bunx turbo run typecheck test:coverage \
            --filter='./packages/*' \
            --filter='./satellites/*' \
            --concurrency=2

      - name: Verify build output
        run: |
          test -f packages/core/dist/index.js || (echo "Missing ESM bundle" && exit 1)
          echo "✅ Build outputs verified"

  # --------------------------------------------------------------------------
  # Quality Checks (Independent)
  # --------------------------------------------------------------------------
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
      - name: Run Quality Checks
        run: |
          # Check for console.log in production code
          LOG_COUNT=$(grep -r "console.log" packages --include="*.ts" --exclude="*.test.ts" --exclude="*.bench.ts" | wc -l || echo "0")
          if [ "$LOG_COUNT" -gt 0 ]; then
            echo "⚠️ Found $LOG_COUNT console.log statements in production code"
          fi
          
          # Check for TODOs
          grep -r "TODO\|FIXME" packages --include="*.ts" --exclude="*.test.ts" | head -10 || true
          
          # Depcheck
          bunx depcheck || echo "⚠️ Some potential unused dependencies found"
