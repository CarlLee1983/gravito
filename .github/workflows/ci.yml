name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # Validate (Fast Fail) - Lint + Build, no DB services needed
  # --------------------------------------------------------------------------
  validate:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
            **/tsconfig.tsbuildinfo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

      - name: Fetch base branch (for PR)
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Lint
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ] && [ -n "$BASE_REF" ]; then
            PATHS=$(bun run scripts/get-affected-packages.ts --base "$BASE_REF" --mode lint --output-paths)
            if [ -n "$PATHS" ]; then
              bunx biome check $PATHS --diagnostic-level=error
            else
              echo "No file changes, skipping lint"
            fi
          else
            bunx biome check packages satellites --diagnostic-level=error
          fi

      - name: Build
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ] && [ -n "$BASE_REF" ]; then
            FILTERS=$(bun run scripts/get-affected-packages.ts --base "$BASE_REF" --mode build)
            if [ -n "$FILTERS" ]; then
              bunx turbo run build $FILTERS --concurrency=4
            else
              echo "No package changes, skipping build"
            fi
          else
            bun run build
          fi

  # --------------------------------------------------------------------------
  # Typecheck & Test (depends on validate, has DB services)
  # Build step relies on turbo cache from validate job
  # --------------------------------------------------------------------------
  test:
    name: Typecheck & Test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: flux_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
      MONGODB_URI: mongodb://localhost:27017
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/flux_test
      TEST_POSTGRESQL: "true"
      DB_POOL_SIZE: "3"
      REDIS_MAX_CLIENTS: "5"
      POSTGRES_MAX_CONNECTIONS: "5"
      RUN_DLQ_INTEGRATION: "false"
      RUN_TRACING_INTEGRATION: "false"
      RUN_PROMETHEUS_INTEGRATION: "false"
      TEST_CONCURRENCY: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
            **/tsconfig.tsbuildinfo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

      - name: Fetch base branch (for PR)
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Enable Integration Tests (Main/Release)
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.event_name }}" == "release" ]]; then
            echo "RUN_DLQ_INTEGRATION=true" >> $GITHUB_ENV
            echo "RUN_TRACING_INTEGRATION=true" >> $GITHUB_ENV
            echo "RUN_PROMETHEUS_INTEGRATION=true" >> $GITHUB_ENV
          fi

      - name: Build
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          # Turbo cache from validate job should make this near-instant
          if [ "${{ github.event_name }}" == "pull_request" ] && [ -n "$BASE_REF" ]; then
            FILTERS=$(bun run scripts/get-affected-packages.ts --base "$BASE_REF" --mode build)
            if [ -n "$FILTERS" ]; then
              bunx turbo run build $FILTERS
            else
              echo "No package changes, skipping build"
            fi
          else
            bun run build
          fi

      - name: Prepare Incremental Filters
        id: filters
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ] && [ -n "$BASE_REF" ]; then
            TYPECHECK_FILTERS=$(bun run scripts/get-affected-packages.ts --base "$BASE_REF" --mode typecheck)
            TEST_FILTERS=$(bun run scripts/get-affected-packages.ts --base "$BASE_REF" --mode test)
            echo "mode=incremental" >> $GITHUB_OUTPUT
          else
            echo "mode=full" >> $GITHUB_OUTPUT
          fi
          echo "typecheck_filters=${TYPECHECK_FILTERS:-}" >> $GITHUB_OUTPUT
          echo "test_filters=${TEST_FILTERS:-}" >> $GITHUB_OUTPUT

      - name: Typecheck & Test (Parallel)
        run: |
          MODE="${{ steps.filters.outputs.mode }}"
          FAILED=0

          if [ "$MODE" == "full" ]; then
            # Main: full typecheck + full coverage tests
            (bunx turbo run typecheck --filter='./packages/*' --filter='./satellites/*' --concurrency=6) &
            PID_TYPECHECK=$!
            (bunx turbo run test:coverage --filter='./packages/*' --concurrency=4 --continue) &
            PID_TEST_PKG=$!
            (bunx turbo run test --filter='./satellites/*' --concurrency=4 --continue) &
            PID_TEST_SAT=$!
          else
            # PR: incremental - only affected packages
            TYPECHECK_FILTERS="${{ steps.filters.outputs.typecheck_filters }}"
            TEST_FILTERS="${{ steps.filters.outputs.test_filters }}"

            if [ -n "$TYPECHECK_FILTERS" ]; then
              (bunx turbo run typecheck $TYPECHECK_FILTERS --concurrency=6) &
              PID_TYPECHECK=$!
            fi
            if [ -n "$TEST_FILTERS" ]; then
              (bunx turbo run test $TEST_FILTERS --concurrency=4 --continue) &
              PID_TEST_PR=$!
            fi
          fi

          # Wait for all background processes
          if [ -n "${PID_TYPECHECK:-}" ]; then
            if wait $PID_TYPECHECK; then echo "Typecheck passed"; else echo "Typecheck failed"; FAILED=1; fi
          fi
          if [ -n "${PID_TEST_PKG:-}" ]; then
            if wait $PID_TEST_PKG; then echo "Test:coverage (packages) passed"; else echo "Test:coverage (packages) failed"; FAILED=1; fi
          fi
          if [ -n "${PID_TEST_SAT:-}" ]; then
            if wait $PID_TEST_SAT; then echo "Test (satellites) passed"; else echo "Test (satellites) failed"; FAILED=1; fi
          fi
          if [ -n "${PID_TEST_PR:-}" ]; then
            if wait $PID_TEST_PR; then echo "Test (incremental) passed"; else echo "Test (incremental) failed"; FAILED=1; fi
          fi

          if [ $FAILED -eq 1 ]; then exit 1; fi

      - name: Check Unused Imports
        env:
          CHANGED_PACKAGES_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: bun run scripts/check-unused-imports.ts --concurrency=4
        continue-on-error: false

      - name: Verify build output
        run: |
          test -f packages/core/dist/index.js || (echo "Missing ESM bundle" && exit 1)

      - name: Monitor System Resources
        if: always()
        run: |
          echo "=== System Resources ===" >> $GITHUB_STEP_SUMMARY
          echo "Memory: $(free -h | grep Mem)" >> $GITHUB_STEP_SUMMARY
          echo "Disk: $(df -h / | tail -1)" >> $GITHUB_STEP_SUMMARY
