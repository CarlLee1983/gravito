name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
      - name: Run linting
        run: bun run check

  build:
    name: Build Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}-${{ github.ref_name }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}-
            turbo-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
      - name: Build
        run: bun run build
      - name: Verify build output
        run: |
          test -f packages/core/dist/index.js || (echo "Missing ESM bundle" && exit 1)
          test -f packages/core/dist/index.cjs || (echo "Missing CJS bundle" && exit 1)
          test -f packages/core/dist/index.d.ts || (echo "Missing type declarations" && exit 1)
          echo "✅ All build outputs verified"

  typecheck:
    name: Typecheck
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
            **/tsconfig.tsbuildinfo
          key: typecheck-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            typecheck-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}-
            typecheck-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
      - name: Run Typecheck
        run: bun run typecheck

  test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Turbo Cache
        uses: actions/cache@v3
        with:
          path: |
            .turbo
            node_modules/.cache/turbo
          key: test-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            test-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}-
            test-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
      - name: Run Tests with Coverage
        run: bun run test:coverage

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1
      - name: Check for TODOs without issues
        run: |
          TODO_COUNT=$(grep -r "TODO\|FIXME" packages --include="*.ts" --exclude="*.test.ts" | wc -l || echo "0")
          echo "Found $TODO_COUNT TODO/FIXME comments"
      - name: Check for @ts-expect-error without comments
        run: |
          grep -rn "@ts-expect-error" packages --include="*.ts" -B1 | grep -v "^--$" | grep -v "Intentional type assertion" | head -20 || echo "✅ All @ts-expect-error have proper comments"
      - name: Check for console.log in production code
        run: |
          LOG_COUNT=$(grep -r "console.log" packages --include="*.ts" --exclude="*.test.ts" --exclude="*.bench.ts" | wc -l || echo "0")
          if [ "$LOG_COUNT" -gt 0 ]; then
            echo "⚠️  Found $LOG_COUNT console.log statements in production code"
          else
            echo "✅ No console.log in production code"
          fi
