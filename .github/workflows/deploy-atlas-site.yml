name: Deploy Atlas Site

on:
  push:
    branches:
      - main
    paths:
      - 'examples/atlas-site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

      - name: Build Core Dependencies
        run: bunx turbo run build --filter=@gravito/atlas --filter=@gravito/photon

      - name: Synchronize to atlas-site-dist repo
        run: |
          set -euo pipefail
          rm -rf atlas-site-dist
          git clone https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/gravito-framework/atlas-site-dist.git atlas-site-dist
          cd atlas-site-dist
          git config user.name "Gravito Deploy Bot"
          git config user.email "bot@gravito.dev"
          find . -maxdepth 1 -mindepth 1 ! -name '.git' ! -name 'CNAME' -exec rm -rf {} +
          cp -R ../examples/atlas-site/dist/. .
          
          # Manually inject GA ID into index.html (Match Official Site Logic)
          GA_ID="${{ secrets.GA_ATLAS_MEASUREMENT_ID }}"
          if [ -n "$GA_ID" ]; then
            echo "💉 Injecting GA Script for: ${GA_ID:0:4}***"
            GA_SCRIPT="<script async src=\"https://www.googletagmanager.com/gtag/js?id=${GA_ID}\"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','${GA_ID}');</script>"
            sed -i "s|<!-- Google Analytics Placeholder -->|$GA_SCRIPT|g" index.html
            
            # Support legacy or alternate placeholder mentioned by user
            sed -i "s|{{VITE_GA_MEASUREMENT_ID}}|$GA_ID|g" index.html
          else
            echo "⚠️ GA_ATLAS_MEASUREMENT_ID is empty! Skipping injection."
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: deploy atlas site with GA ($(date -u +"%Y-%m-%d %H:%M UTC"))"
            git push origin main
          else
            echo "No changes to deploy"
          fi
