<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{#if title}}{{{ title }}}{{else}}Gravito Zenith - Zero-Config Control Plane{{/if}}</title>
    
    <!-- SEO Meta Tags -->
    {{#if description}}
    <meta name="description" content="{{{ description }}}">
    {{else}}
    <meta name="description" content="Zero-config control plane for Gravito Flux & Stream. Real-time monitoring, queue management, and automated alerting.">
    {{/if}}
    <meta name="keywords" content="gravito, zenith, monitoring, queue, redis, laravel, bullmq, stream, dashboard">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="alternate icon" type="image/png" href="/static/favicon.png">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{#if title}}{{{ title }}}{{else}}Gravito Zenith{{/if}}">
    <meta property="og:description" content="{{#if description}}{{{ description }}}{{else}}Zero-config control plane for Gravito Flux & Stream.{{/if}}">
    <meta property="og:image" content="/static/build/images/hero_bg.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:title" content="{{#if title}}{{{ title }}}{{else}}Gravito Zenith{{/if}}">
    <meta property="twitter:description" content="{{#if description}}{{{ description }}}{{else}}Zero-config control plane for Gravito Flux & Stream.{{/if}}">
    <meta property="twitter:image" content="/static/build/images/hero_bg.png">

    {{#if isDev}}
    <!-- Development mode: Load from Vite dev server (proxied through backend) -->
    <script type="module">
        import RefreshRuntime from "/@react-refresh"
        RefreshRuntime.injectIntoGlobalHook(window)
        window.$RefreshReg$ = () => { }
        window.$RefreshSig$ = () => (type) => type
        window.__vite_plugin_react_preamble_installed__ = true
    </script>
    <script type="module" src="/@vite/client"></script>
    <script type="module" src="/app.tsx"></script>
    {{else}}
    <!-- Production mode: Load from built assets -->
    <script type="module" src="/static/build/assets/app.js"></script>
    <link rel="stylesheet" href="/static/build/assets/app.css">
    {{/if}}

    <!-- Google Analytics Placeholder -->
</head>

<body>
    <div id="app" data-page='{{{ page }}}'></div>
</body>

</html>
