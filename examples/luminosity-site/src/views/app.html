<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luminosity</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <meta name="theme-color" content="#10B981">

    {{#if isDev}}
    <script type="module" src="/@vite/client"></script>
    <script type="module" src="/app.ts"></script>
    {{else}}
    <link rel="stylesheet" href="/static/build/assets/app.css">
    <script type="module" src="/static/build/assets/app.js"></script>
    {{/if}}

    <!-- Google Analytics -->
    <script>
        (function() {
            // Defer GA initialization until DOM is ready
            var initGA = function() {
                try {
                    var pageEl = document.querySelector('[data-page]');
                    if (!pageEl) {
                        console.debug('[GA] Page element not found (yet)');
                        return;
                    }
                    var pageData = pageEl.getAttribute('data-page');
                    if (!pageData) {
                        console.warn('[GA] Page data attribute is empty');
                        return;
                    }
                    var page = JSON.parse(pageData);
                    var gaId = page.props && page.props.gaId;
                    if (gaId) {
                        var script = document.createElement('script');
                        script.async = true;
                        script.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
                        document.head.appendChild(script);

                        window.dataLayer = window.dataLayer || [];
                        function gtag(){dataLayer.push(arguments);}
                        gtag('js', new Date());
                        gtag('config', gaId);
                    } else {
                        console.debug('[GA] GA ID not found in props');
                    }
                } catch (e) {
                    console.warn('[GA] Failed to initialize:', e);
                }
            };

            // Try to initialize immediately if DOM is ready
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initGA);
            } else {
                initGA();
            }
        })();
    </script>
</head>

<body class="bg-black">
    <div id="app" data-page='{{{ page }}}'></div>
</body>

</html>
