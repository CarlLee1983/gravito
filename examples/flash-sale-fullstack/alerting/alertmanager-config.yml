global:
  resolve_timeout: 5m

route:
  receiver: 'null'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  routes:
    - match:
        severity: critical
      receiver: 'null'
      group_wait: 0s
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'null'
      group_wait: 1m
      repeat_interval: 4h

    - match:
        severity: info
      receiver: 'null'
      group_wait: 5m
      repeat_interval: 24h

receivers:
  - name: 'null'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: 'High.*|Low.*'
    equal: ['service']
