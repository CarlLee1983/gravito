version: '3.8'

services:
  # PostgreSQL 資料庫
  postgres:
    image: postgres:15-alpine
    container_name: flash-sale-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flash_sale
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 快取與分佈式鎖
  redis:
    image: redis:7-alpine
    container_name: flash-sale-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis GUI (可選)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: flash-sale-redis-gui
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis

  # pgAdmin (可選，資料庫管理)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: flash-sale-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # Jaeger 分佈式追蹤
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: flash-sale-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "5775:5775/udp"     # agent compact thrift
      - "6831:6831/udp"     # agent compact thrift
      - "6832:6832/udp"     # agent binary thrift
      - "5778:5778"         # agent configs
      - "16686:16686"       # Jaeger UI
      - "14268:14268"       # collector HTTP (Jaeger Exporter 使用此端口)
      - "14250:14250"       # collector gRPC
      - "4317:4317"         # OTLP gRPC
      - "4318:4318"         # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: flash-sale-network
